name: Scheduler contract tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduler-contract-tests
  cancel-in-progress: false

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out public test repository only
        uses: actions/checkout@v4
      - name: Run isolated contract tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
